<section class="profile-section py-5">

  <div class="container">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

      <div>
        <h2 class="fw-bold mb-1">
          My Profile
        </h2>

        <p class="text-muted mb-0">
          Manage your account information
        </p>
      </div>

      @if (!isEditMode) {

        <button
          type="button"
          class="btn btn-primary"
          (click)="editProfile()">

          <i class="bi bi-pencil"></i>
          Edit Profile

        </button>

      }

    </div>


    <div class="row g-4">

      <!-- Profile Information -->
      <div class="col-lg-8">

        <div class="profile-card">

          <div class="card-header-custom">

            <h5>
              <i class="bi bi-person-circle"></i>
              Profile Information
            </h5>

          </div>


          <div class="card-body-custom">

            <!-- Name -->
            <div class="mb-3">

              <label class="form-label">
                Full Name
              </label>

              <input
                type="text"
                class="form-control"
                [(ngModel)]="name"
                [disabled]="!isEditMode">

            </div>


            <!-- Email -->
            <div class="mb-3">

              <label class="form-label">
                Email
              </label>

              <input
                type="email"
                class="form-control"
                [(ngModel)]="email"
                [disabled]="!isEditMode">

            </div>


            <!-- Phone -->
            <div class="mb-3">

              <label class="form-label">
                Phone
              </label>

              <input
                type="text"
                class="form-control"
                [(ngModel)]="phone"
                [disabled]="!isEditMode">

            </div>


            <!-- Account Status -->
            <div class="mb-3">

              <label class="form-label">
                Account Status
              </label>

              <div>

                <span class="badge bg-success">
                  {{ accountStatus }}
                </span>

              </div>

            </div>


            <!-- Buttons -->
            @if (isEditMode) {

              <div class="d-flex gap-2 mt-4">

                <button
                  type="button"
                  class="btn btn-success"
                  (click)="saveProfile()">

                  <i class="bi bi-check-lg"></i>
                  Save Changes

                </button>


                <button
                  type="button"
                  class="btn btn-secondary"
                  (click)="cancelEdit()">

                  Cancel

                </button>

              </div>

            }

          </div>

        </div>


        <!-- Address -->
        <div class="profile-card mt-4">

          <div class="card-header-custom">

            <h5>
              <i class="bi bi-geo-alt"></i>
              Delivery Address
            </h5>

          </div>


          <div class="card-body-custom">

            <div class="mb-3">

              <label class="form-label">
                Address
              </label>

              <textarea
                class="form-control"
                rows="3"
                [(ngModel)]="address"
                [disabled]="!isEditMode">
              </textarea>

            </div>


            <div class="row">

              <div class="col-md-6 mb-3">

                <label class="form-label">
                  City
                </label>

                <select
                  class="form-select"
                  [(ngModel)]="city"
                  [disabled]="!isEditMode">

                  <option value="Dhaka">
                    Dhaka
                  </option>

                  <option value="Chittagong">
                    Chittagong
                  </option>

                  <option value="Sylhet">
                    Sylhet
                  </option>

                  <option value="Rajshahi">
                    Rajshahi
                  </option>

                </select>

              </div>


              <div class="col-md-6 mb-3">

                <label class="form-label">
                  Postal Code
                </label>

                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="postalCode"
                  [disabled]="!isEditMode">

              </div>

            </div>

          </div>

        </div>

      </div>


      <!-- Quick Actions -->
      <div class="col-lg-4">

        <div class="profile-card">

          <div class="card-header-custom">

            <h5>
              <i class="bi bi-grid"></i>
              Quick Actions
            </h5>

          </div>


          <div class="card-body-custom">

            <a
              routerLink="/orders"
              class="action-item">

              <i class="bi bi-box-seam"></i>

              <div>
                <strong>My Orders</strong>

                <small>
                  View your orders
                </small>
              </div>

              <i class="bi bi-chevron-right ms-auto"></i>

            </a>


            <a
              routerLink="/wishlist"
              class="action-item">

              <i class="bi bi-heart"></i>

              <div>
                <strong>Wishlist</strong>

                <small>
                  View saved products
                </small>
              </div>

              <i class="bi bi-chevron-right ms-auto"></i>

            </a>


            <button
              type="button"
              class="action-item w-100">

              <i class="bi bi-key"></i>

              <div>
                <strong>Change Password</strong>

                <small>
                  Update your password
                </small>
              </div>

              <i class="bi bi-chevron-right ms-auto"></i>

            </button>


            <button
              type="button"
              class="action-item logout w-100">

              <i class="bi bi-box-arrow-right"></i>

              <div>
                <strong>Logout</strong>

                <small>
                  Sign out from your account
                </small>
              </div>

              <i class="bi bi-chevron-right ms-auto"></i>

            </button>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>
